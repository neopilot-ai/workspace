# Based on https://github.com/khulnasoft/ml-buildkit/blob/v0.6.6/workflows/build-pipeline.yml
name: build-pipeline

on:
  workflow_dispatch:
    inputs:
      build_args:
        description: "Arguments passed to build script"
        required: false
        default: "--make --force --test"
      working_directory:
        description: "Working directory from where the build command is run"
        required: false
        default: "."
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ARGS: ${{ github.event.inputs.build_args || secrets.BUILD_ARGS }}
  WORKING_DIRECTORY: ${{ github.event.inputs.working_directory || secrets.WORKING_DIRECTORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: set-host-ip
        run: echo "_HOST_IP=$(hostname -I | cut -d ' ' -f 1)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: install-build-requirements
        run: pip install -r build_requirements.txt
      - name: run-lint
        run: ruff check .
      - name: run-build-scripts
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-environment
        with:
          build_args: ${{ env.BUILD_ARGS }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: run-build-scripts-without-token
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-environment
        with:
          build_args: ${{ env.BUILD_ARGS }}
          working_directory: ${{ env.WORKING_DIRECTORY }}
      - name: generate-sbom
        run: make sbom
      - name: scan-vulnerabilities
        run: make scan
      - name: audit-policy
        run: make audit
      - name: upload-sbom
        if: always() && hashFiles('build/sbom.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: build/sbom.json
          if-no-files-found: error
          retention-days: 14
