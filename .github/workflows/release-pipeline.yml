# Based on https://github.com/khulnasoft/ml-buildkit/blob/v0.6.6/workflows/build-pipeline.yml
name: release-pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of this release"
        required: true
  milestone:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_PREFIX: "release/v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: resolve-and-check-version
        id: release-version
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
        run: |
          if [[ -n "$MILESTONE_TITLE" ]]; then
            VERSION="${MILESTONE_TITLE#v}"
          else
            VERSION="$RELEASE_VERSION_INPUT"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "The version is not valid: $VERSION"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: set-host-ip
        run: echo "_HOST_IP=$(hostname -I | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: create-release-branch
        if: github.token != ''
        uses: peterjgrainger/action-create-branch@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: "${{ env.BRANCH_PREFIX }}${{ steps.release-version.outputs.version }}"
      - name: checkout-release-branch
        if: github.token != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_PREFIX }}${{ steps.release-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: run-component-builds
        uses: ./.github/actions/build-environment
        with:
          build_args: --make --force --version=${{ steps.release-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: run-linting-and-style-checks
        uses: ./.github/actions/build-environment
        with:
          build_args: --check --force --version=${{ steps.release-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: run-component-tests
        uses: ./.github/actions/build-environment
        with:
          build_args: --test --force --test-marker=slow --version=${{ steps.release-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: release-components
        uses: ./.github/actions/build-environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PYPI_REPOSITORY: ${{ secrets.PYPI_REPOSITORY }}
        with:
          build_args: --release --force --version=${{ steps.release-version.outputs.version }}
          container_registry_url: ${{ secrets.CONTAINER_REGISTRY_URL }}
          container_registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          container_registry_password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - name: push-changes
        if: github.token != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ env.BRANCH_PREFIX }}${{ steps.release-version.outputs.version }}
          commit_user_name: Release Bot
          commit_user_email: actions@github.com
          commit_message: Apply automatic release changes for v${{ steps.release-version.outputs.version }}
          tagging_message: v${{ steps.release-version.outputs.version }}
          skip_dirty_check: true
          commit_options: "--allow-empty"
      - name: create-pull-request
        if: github.token != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          RELEASE_BRANCH="${BRANCH_PREFIX}${RELEASE_VERSION}"
          EXISTING_PR=$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq 'length')
          if [[ "$EXISTING_PR" == "0" ]]; then
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "Finalize release for version $RELEASE_VERSION" \
              --body "Automated pull request for release version $RELEASE_VERSION" \
              --label "skip changelog"
          else
            echo "An open pull request already exists for $RELEASE_BRANCH"
          fi
      - name: create-release-draft
        if: github.token != ''
        uses: release-drafter/release-drafter@v6
        with:
          version: ${{ steps.release-version.outputs.version }}
          tag: v${{ steps.release-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
